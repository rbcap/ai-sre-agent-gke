apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: ai-sre
  labels:
    app: payment-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting payment-api..."
              echo "ERROR: DATABASE_URL environment variable is missing"
              echo "Application startup failed"
              exit 1
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
