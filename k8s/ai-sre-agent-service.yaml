apiVersion: v1
kind: Service
metadata:
  name: ai-sre-agent
  namespace: ai-sre

  annotations:
    cloud.google.com/backend-config: '{"default":"ai-sre-backendconfig"}'

spec:
  type: ClusterIP

  selector:
    app: ai-sre-agent

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
